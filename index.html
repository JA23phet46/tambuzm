<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>tambu | Find your next home in Zambia</title>
    <!-- Standalone Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#b52330" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#fbf9f8] text-[#1b1c1c]">
    <div id="root">
      <!-- Deep Pink Loading Splash Screen -->
      <div style="background-color: #b52330; position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: 'Inter', -apple-system, system-ui, sans-serif; transition: opacity 0.4s ease-out; width: 100vw; height: 100vh;">
        <!-- lowercase lettering -->
        <span style="font-size: 36px; font-weight: 800; letter-spacing: -0.06em; color: #ffffff; animation: tambu-pulse 2s infinite ease-in-out;">tambu</span>
        <style>
          @keyframes tambu-pulse {
            0%, 100% { opacity: 0.6; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.03); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
